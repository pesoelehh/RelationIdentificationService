version: '3.9'

services:
  fastapi:
    build: AI-service
    container_name: fastapi-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - keycloak
    volumes:
      - ./app:/app
    restart: unless-stopped

  springboot:
    build: Main-Service
    container_name: springboot-app
    ports:
      - "8081:8081"
    environment:
      - KEYCLOAK_URL=http://keycloak:8080
      - AI_SERVICE_URL=http://fastapi:8000
      - RESTPROJECT_BASEURL=http://host.docker.internal:8090/v1
    depends_on:
      - keycloak
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.1
    container_name: keycloak
    command:
      - start-dev
      - --import-realm
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_PASSWORD}
    volumes:
      - C:/Users/gabri/Keycloak/keycloak-26.3.1/keycloak-26.3.1/data:/opt/keycloak/data
      - C:/Users/gabri/Keycloak/import:/opt/keycloak/data/import
    restart: unless-stopped


